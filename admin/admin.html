<!doctype html>
<html lang="en" translate="no"><head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | FCAI-CU</title><link rel="stylesheet" href="/style.css">
</head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<header class="nav"><a href="/" class="brand"><span class="r">FCAI</span><span class="d">-</span><span class="b">CU</span></a><span style="margin-left:16px;color:var(--gray)">Admin</span></header>
<main class="wrap">
  <h1 style="font-size:34px">Admin</h1>
  <p class="muted" style="margin:6px 0 4px">Everything is saved on this computer. When you finish, push <b>content.json</b> and <b>files/</b> to GitHub.</p>
  <div id="msg"></div>
  <div class="adm">
    <div class="card"><h3>1. Pick a folder</h3>
      <p class="muted" style="font-size:13px;margin-bottom:8px">Click a folder to choose where new things go. Hold an item and drag it to move it or reorder it.</p>
      <div class="tree" id="tree"></div><input type="file" id="subpick" accept=".srt,.vtt" hidden></div>
    <div class="card"><h3 id="target"></h3><div class="tabs" id="tabs"></div><form id="form"></form></div>
  </div>
</main>
<script>
let T = { nodes: [] }, sel = 'root', mode = 'file', src = 'device', busy = '', expanded = new Set(), justDragged = false, pendingCC = null;
const $ = (s) => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function migrate(d) {
  if (d.nodes) return d;
  const f = (m) => ({ id: m.id, type: 'file', title: m.title, kind: m.type, url: m.url, note: m.note });
  return { nodes: (d.courses || []).map((c) => ({ id: c.id, type: 'folder', title: c.title, children: c.sections.map((s) => ({ id: s.id, type: 'folder', title: s.title, children: s.materials.map(f) })) })) };
}
const EXT = { video: 'mp4 webm mov mkv avi m4v ogv wmv flv 3gp mpeg mpg', image: 'png jpg jpeg gif webp svg bmp', office: 'doc docx ppt pptx xls xlsx odt odp ods rtf', text: 'txt md csv log py js ts jsx tsx java c cpp h hpp cs go rs rb php swift kt sql sh bash html css json xml yml yaml r m lua pl dart scala' };
function kindOf(name) { const e = name.split('?')[0].split('.').pop().toLowerCase(); if (e === 'pdf') return 'pdf'; for (const k in EXT) if (EXT[k].split(' ').includes(e)) return k; return 'file'; }
function detect(u) { const l = u.toLowerCase(); if (l.includes('drive.google.com') || l.includes('docs.google.com')) return 'drive'; if (l.includes('youtube.com') || l.includes('youtu.be')) return 'youtube'; const k = kindOf(l); return k === 'file' ? 'link' : k; }
const isSub = (name) => /\.(srt|vtt)$/i.test(name);
const driveId = (u) => ((u || '').match(/\/folders\/([\w-]+)/) || (u || '').match(/\/d\/([\w-]+)/) || (u || '').match(/[?&]id=([\w-]+)/) || (/^[\w-]{20,}$/.test((u || '').trim()) ? [0, u.trim()] : []))[1];
const baseName = (n) => n.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
// يربط كل فيديو بملف الترجمة بتاعه: نفس الاسم، أو لو فيديو واحد وترجمة واحدة
function pair(videos, subs) {
  const m = new Map(), left = [...subs];
  videos.forEach((v) => { const i = left.findIndex((s) => baseName(s.name) === baseName(v.name)); if (i >= 0) m.set(v, left.splice(i, 1)[0]); });
  const rest = videos.filter((v) => !m.has(v));
  if (rest.length === 1 && left.length === 1) m.set(rest[0], left[0]);
  return m;
}

/* ===== الشجرة ===== */
function locate(id, arr = T.nodes) { for (let i = 0; i < arr.length; i++) { const n = arr[i]; if (n.id === id) return { n, arr, i }; if (n.children) { const r = locate(id, n.children); if (r) return r; } } return null; }
const contains = (n, id) => (n.children || []).some((c) => c.id === id || contains(c, id));
function findParent(id, arr = T.nodes, parent = null) { for (const n of arr) { if (n.id === id) return parent; if (n.children) { const r = findParent(id, n.children, n); if (r) return r; } } return null; }
function targetFolder() { if (sel === 'root') return { children: T.nodes, title: '' }; const l = locate(sel); if (!l) return { children: T.nodes, title: '' }; return l.n.type === 'folder' ? l.n : findParent(sel) || { children: T.nodes, title: '' }; }
function pathOf(f) { if (f.children === T.nodes) return 'Top level'; const out = []; (function walk(arr, acc) { for (const n of arr) { if (n === f) { out.push(...acc, n.title); return true; } if (n.children && walk(n.children, [...acc, n.title])) return true; } })(T.nodes, []); return out.join(' / '); }
async function save(m) {
  await fetch('/api/content', { method: 'POST', body: JSON.stringify(T) });
  $('#msg').innerHTML = `<div class="ok">${esc(m || 'Saved')}</div>`; setTimeout(() => ($('#msg').innerHTML = ''), 3500);
  renderTree();
}
function move(id, tid, pos) {
  if (id === tid) return; const src = locate(id); if (!src) return;
  if (tid !== 'root' && src.n.type === 'folder' && contains(src.n, tid)) return;
  src.arr.splice(src.i, 1);
  if (tid === 'root') T.nodes.push(src.n);
  else { const t = locate(tid); if (pos === 'in' && t.n.type === 'folder') { t.n.children.push(src.n); expanded.add(t.n.id); } else t.arr.splice(t.i + (pos === 'after' ? 1 : 0), 0, src.n); }
  save('Moved');
}
function treeHTML(nodes, depth) {
  return nodes.map((n) => {
    const folder = n.type === 'folder', open = expanded.has(n.id), cc = !folder && ['video', 'drive', 'youtube'].includes(n.kind);
    return `<div class="trow ${sel === n.id ? 'sel' : ''}" data-row="${n.id}" style="padding-left:${depth * 20 + 6}px"><span class="grip" title="Drag">⋮⋮</span>
      <span class="car">${folder ? (open ? '▾' : '▸') : ''}</span><span class="tt">${folder ? '📁 ' : ''}${esc(n.title)}${folder ? '' : ` <span class="tag">${n.kind}${n.subtitle ? ' · CC' : ''}</span>`}</span>
      ${cc ? `<button data-cc="${n.id}" title="Add / replace subtitle">CC</button>` : ''}<button data-ren="${n.id}" title="Rename">✎</button><button data-del="${n.id}" title="Delete">✕</button></div>` + (folder && open ? treeHTML(n.children, depth + 1) : '');
  }).join('');
}
function renderTree() {
  $('#tree').innerHTML = `<div class="trow ${sel === 'root' ? 'sel' : ''}" data-row="root"><span class="tt">🏠 Top level</span></div>` + treeHTML(T.nodes, 1) + (T.nodes.length ? '' : '<p class="muted" style="padding:10px">Nothing yet. Create your first folder on the right (for example: First year).</p>');
  $('#target').textContent = '2. Add inside: ' + pathOf(targetFolder());
}
$('#tree').addEventListener('click', (e) => {
  if (justDragged) return;
  const cc = e.target.closest('[data-cc]'), ren = e.target.closest('[data-ren]'), del = e.target.closest('[data-del]'), row = e.target.closest('[data-row]');
  if (cc) {
    const l = locate(cc.dataset.cc), v = prompt('Paste the Google Drive link of the subtitle file (.srt / .vtt).\nLeave it empty and press OK to choose a file from this computer instead.', '');
    if (v === null) return;
    if (v.trim()) { const id = driveId(v); if (!id) return alert('That does not look like a Drive link.'); l.n.subtitle = 'drive:' + id; save('Subtitle attached'); }
    else { pendingCC = cc.dataset.cc; $('#subpick').click(); }
    return;
  }
  if (ren) { const l = locate(ren.dataset.ren), t = prompt('New name', l.n.title); if (t && t.trim()) { l.n.title = t.trim(); save('Renamed'); } return; }
  if (del) { const l = locate(del.dataset.del); if (confirm(`Delete "${l.n.title}"${l.n.type === 'folder' ? ' and everything inside it' : ''}?`)) { l.arr.splice(l.i, 1); if (sel === l.n.id) sel = 'root'; save('Deleted'); } return; }
  if (row) { const id = row.dataset.row; sel = id; if (id !== 'root') { const n = locate(id).n; if (n.type === 'folder') expanded.has(id) ? expanded.delete(id) : expanded.add(id); } renderTree(); }
});
$('#subpick').addEventListener('change', async (e) => { const file = e.target.files[0]; if (!file || !pendingCC) return; locate(pendingCC).n.subtitle = await upload(file); e.target.value = ''; await save('Subtitle attached'); });

/* ===== السحب بالضغط المطوّل ===== */
$('#tree').addEventListener('pointerdown', (e) => {
  const row = e.target.closest('[data-row]');
  if (!row || row.dataset.row === 'root' || e.target.closest('button') || e.button > 0) return;
  if (e.pointerType === 'touch' && !e.target.closest('.grip')) return;
  const id = row.dataset.row, x = e.clientX, y = e.clientY;
  const cancel = () => { clearTimeout(timer); removeEventListener('pointerup', cancel); removeEventListener('pointermove', mv); };
  const mv = (ev) => { if (Math.hypot(ev.clientX - x, ev.clientY - y) > 8) cancel(); };
  const timer = setTimeout(() => { cancel(); startDrag(id, row, x, y); }, e.pointerType === 'touch' ? 120 : 400);
  addEventListener('pointermove', mv); addEventListener('pointerup', cancel);
});
function startDrag(id, row, x, y) {
  const g = document.createElement('div'); g.className = 'dragghost'; g.textContent = row.querySelector('.tt').textContent.trim(); document.body.appendChild(g);
  document.body.classList.add('dragging'); row.style.opacity = '.4';
  let tid = null, pos = null;
  const clear = () => document.querySelectorAll('.drop-in,.drop-before,.drop-after').forEach((r) => r.classList.remove('drop-in', 'drop-before', 'drop-after'));
  const place = (ev) => {
    g.style.left = ev.clientX + 12 + 'px'; g.style.top = ev.clientY + 12 + 'px'; clear(); tid = pos = null;
    const r = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-row]'); if (!r) return;
    const rid = r.dataset.row, n = rid === 'root' ? null : locate(rid).n, b = r.getBoundingClientRect(), f = (ev.clientY - b.top) / b.height, folder = !n || n.type === 'folder';
    if (rid === id || (n && locate(id).n.type === 'folder' && contains(locate(id).n, rid))) return;
    pos = !n ? 'in' : folder ? (f < 0.25 ? 'before' : f > 0.75 ? 'after' : 'in') : (f < 0.5 ? 'before' : 'after');
    tid = rid; r.classList.add('drop-' + pos);
  };
  const up = () => {
    removeEventListener('pointermove', place); removeEventListener('pointerup', up);
    g.remove(); clear(); row.style.opacity = ''; document.body.classList.remove('dragging');
    justDragged = true; setTimeout(() => (justDragged = false), 50);
    if (tid) move(id, tid, pos);
  };
  place({ clientX: x, clientY: y }); addEventListener('pointermove', place); addEventListener('pointerup', up);
}

/* ===== الفورم ===== */
const TABS = [['file', 'Add file'], ['folder', 'New folder'], ['drive', 'Import Drive folder'], ['note', 'Note'], ['key', 'Drive key']];
async function upload(file) { const r = await fetch('/api/upload', { method: 'POST', headers: { 'x-filename': encodeURIComponent(file.name) }, body: file }); return (await r.json()).url; }
function renderForm() {
  $('#tabs').innerHTML = TABS.map(([k, v]) => `<button type="button" class="${mode === k ? 'on' : ''}" data-m="${k}">${v}</button>`).join('');
  let h = '', btn = 'Add';
  if (mode === 'folder') h = '<label>Folder name (for example: First year, 1 Semester, Week 1, Lecture, Record)</label><input name="t" required>';
  else if (mode === 'file') {
    h = `<div class="tabs"><button type="button" class="${src === 'device' ? 'on' : ''}" data-src="device">From my computer</button><button type="button" class="${src === 'link' ? 'on' : ''}" data-src="link">From a link (Drive / YouTube)</button></div>`;
    if (src === 'device') h += '<label>Choose the files. You can pick many at once: videos, PDFs, slides, text. Put the subtitle files (.srt / .vtt) in the same selection and each one is matched to its video automatically.</label><input type="file" name="f" multiple required>';
    else h += '<label>Link (Google Drive file, YouTube video, or any direct link)</label><input name="u" placeholder="https://drive.google.com/file/d/..." required><label>Title</label><input name="t" required><label>Subtitle (optional): choose a .srt/.vtt file</label><input type="file" name="sf" accept=".srt,.vtt"><label>or paste the Drive link of the subtitle</label><input name="sl" placeholder="https://drive.google.com/file/d/...">';
  } else if (mode === 'drive') { h = `<label>Link of a Google Drive folder (shared with "Anyone with the link")</label><input name="u" placeholder="https://drive.google.com/drive/folders/..." required>
      <p class="muted" style="font-size:13px;margin-top:10px">It copies the folders and files into the selected folder. A subtitle file in the same Drive folder is attached to its video automatically. Needs the Drive key (last tab).</p><pre class="plain" id="log" style="margin-top:12px;display:none"></pre>`; btn = 'Import'; }
  else if (mode === 'note') h = '<label>Title</label><input name="t" required><label>Text</label><textarea name="n" rows="6" required></textarea>';
  else { h = `<p class="muted" style="font-size:14px;line-height:1.7">The key lets the site play Drive videos in the nice player with subtitles. Free. One time setup:<br>
      1. Open <b>console.cloud.google.com</b> and create a project.<br>2. APIs &amp; Services &gt; Library &gt; <b>Google Drive API</b> &gt; Enable.<br>3. Credentials &gt; Create credentials &gt; <b>API key</b>, then copy it.<br>
      4. (Recommended) Edit the key: API restrictions = Drive API only; Website restrictions = your site and <b>http://localhost:3000/*</b>.</p>
      <label>Drive API key</label><input name="k" value="${esc(T.driveKey || '')}" placeholder="AIza..." required>`; btn = 'Save key'; }
  $('#form').innerHTML = h + `<button class="btn ${mode === 'folder' ? 'red' : ''}" style="margin-top:16px" ${busy ? 'disabled' : ''}>${busy || btn}</button>`;
}
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-m]'), s = e.target.closest('[data-src]');
  if (b) { mode = b.dataset.m; renderForm(); } if (s) { src = s.dataset.src; renderForm(); }
});
$('#form').addEventListener('click', (e) => { const s = e.target.closest('[data-src]'); if (s) { src = s.dataset.src; renderForm(); } });

async function gList(id) {
  let out = [], tok = '';
  do {
    const q = encodeURIComponent(`'${id}' in parents and trashed=false`);
    const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&orderBy=name&key=${T.driveKey}${tok ? '&pageToken=' + tok : ''}`);
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || 'HTTP ' + r.status);
    out = out.concat(j.files || []); tok = j.nextPageToken || '';
  } while (tok);
  return out;
}
async function importFolder(id, dest, st) {
  const items = await gList(id), subs = items.filter((x) => isSub(x.name)), vids = items.filter((x) => x.mimeType.startsWith('video/') || kindOf(x.name) === 'video'), pm = pair(vids, subs);
  for (const it of items) {
    if (it.mimeType === 'application/vnd.google-apps.folder') { const n = { id: uid(), type: 'folder', title: it.name, children: [] }; dest.push(n); st.folders++; await importFolder(it.id, n.children, st); }
    else if (!isSub(it.name)) { const s = pm.get(it); dest.push({ id: uid(), type: 'file', title: it.name.replace(/\.[^.]+$/, ''), kind: 'drive', url: `https://drive.google.com/file/d/${it.id}/view`, ...(s ? { subtitle: 'drive:' + s.id } : {}) }); st.files++; if (s) st.subs++; }
  }
}

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target, dest = targetFolder().children;
  try {
    if (mode === 'folder') { dest.push({ id: uid(), type: 'folder', title: f.t.value.trim(), children: [] }); if (sel !== 'root' && locate(sel)?.n.type === 'folder') expanded.add(sel); await save('Folder added'); }
    else if (mode === 'key') { T.driveKey = f.k.value.trim(); await save('Key saved'); }
    else if (mode === 'note') { dest.push({ id: uid(), type: 'file', title: f.t.value.trim(), kind: 'note', note: f.n.value }); await save('Note added'); }
    else if (mode === 'drive') {
      if (!T.driveKey) { alert('Add the Drive key first (last tab).'); return; }
      const id = driveId(f.u.value); if (!id) { alert('That does not look like a Drive folder link.'); return; }
      const log = $('#log'); log.style.display = 'block'; log.textContent = 'Reading the folder...'; busy = 'Importing...'; renderForm();
      const st = { files: 0, folders: 0, subs: 0 };
      try { await importFolder(id, dest, st); log.textContent = ''; await save(`Imported ${st.files} files, ${st.folders} folders, ${st.subs} subtitles matched`); }
      catch (err) { await save(`Imported partially: ${st.files} files`); alert('Google said: ' + err.message); }
    }
    else if (src === 'device') {
      const all = [...f.f.files], subs = all.filter((x) => isSub(x.name)), main = all.filter((x) => !isSub(x.name)), pm = pair(main.filter((x) => kindOf(x.name) === 'video'), subs);
      for (let i = 0; i < main.length; i++) {
        busy = `Uploading ${i + 1}/${main.length}...`; renderForm();
        const url = await upload(main[i]), s = pm.get(main[i]);
        dest.push({ id: uid(), type: 'file', title: main[i].name.replace(/\.[^.]+$/, ''), kind: kindOf(main[i].name), url, ...(s ? { subtitle: await upload(s) } : {}) });
      }
      const lonely = subs.length - pm.size;
      await save(`${main.length} file(s) added${pm.size ? `, ${pm.size} subtitle(s) matched` : ''}${lonely > 0 && main.length ? `. ${lonely} subtitle file(s) had no matching video` : ''}`);
    } else {
      const sf = f.sf.files[0], sid = driveId(f.sl.value), sub = sf ? await upload(sf) : sid ? 'drive:' + sid : '';
      dest.push({ id: uid(), type: 'file', title: f.t.value.trim(), kind: detect(f.u.value), url: f.u.value.trim(), ...(sub ? { subtitle: sub } : {}) }); await save('Added');
    }
  } finally { busy = ''; }
  renderForm();
});
(async () => { T = migrate(await (await fetch('/api/content')).json()); renderTree(); renderForm(); })();
</script>
</body></html>
